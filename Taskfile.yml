version: "3"

# Lanzador. Las tareas locales y de producción viven en módulos separados.
includes:
  local:
    taskfile: ./taskfiles/Taskfile.local.yml
  prod:
    taskfile: ./taskfiles/Taskfile.prod.yml
    optional: true

tasks:
  default:
    desc: "Ayuda del stack local"
    cmds:
      - task local:default
